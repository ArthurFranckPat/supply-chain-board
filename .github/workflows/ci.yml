name: CI

# Remplace l'ancienne CI du monorepo Python (supprimée avec `apps/`,
# `services/` et `packages/` en 1e47671). Le dépôt est désormais une seule
# application AdonisJS 7 + React 19, sans Python ni workspace.
#
# Budget : le run se juge sur son job le plus long. Chaque contrôle vit dans
# son propre job pour tourner en parallèle, et `node_modules` est restauré
# depuis le cache (action locale `deps`) au lieu d'un `npm ci` par job.

on:
  pull_request:
    paths-ignore: &docs-only
      # Un commit qui ne touche que de la doc n'a rien à valider. Un push qui
      # mélange doc et code déclenche la CI normalement.
      - '**/*.md'
      - 'docs/**'
      - '.planning/**'
      - '.impeccable/**'
  push:
    branches:
      - master
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Le dev tourne sur Node 26 — la CI doit valider la même chose.
  NODE_VERSION: '26'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Cache ESLint d'un run à l'autre : seuls les fichiers modifiés depuis le
      # dernier run sont relintés. `content` et non `metadata` : le checkout
      # donne à chaque fichier une mtime neuve. La config n'utilise pas l'info
      # de types (pas de `projectService`), donc un cache par fichier est sûr.
      # La clé change avec le lockfile ou la config : ESLint ne détecte pas
      # seul une montée de version d'un plugin.
      - uses: actions/cache@v6
        with:
          path: .cache/eslint
          key: eslint-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('package-lock.json', 'eslint.config.js') }}-

      - run: npx eslint . --cache --cache-location .cache/eslint/ --cache-strategy content

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tsgo (TypeScript 7 natif), deux passes : la racine (backend, exclut
      # inertia-react) puis le front. `ace build` du job Build recompile en
      # plus le backend avec tsc 6.
      - run: npm run typecheck

  generated:
    name: Artefacts générés
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Env de boot
        uses: ./.github/actions/boot-env

      # Les deux vérifications suivantes régénèrent un fichier commité et
      # échouent sur `git diff --exit-code` : elles attrapent un artefact
      # périmé, pas une erreur de compilation. Le manifeste de routes s'était
      # déjà désynchronisé sans que personne le voie.
      - name: Manifeste de routes à jour
        run: npm run routes:check

      - name: Apps MCP à jour
        run: npm run mcp:apps:check

  # Porte le nom du check requis par la protection de master (« Quality »,
  # ancien job monolithique) : sans lui, le check requis resterait en attente
  # indéfiniment sur les PR. Ne rien y exécuter — il ne fait qu'agréger.
  quality:
    name: Quality
    needs: [lint, typecheck, generated]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "lint, typecheck et artefacts générés verts"

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    # Court exprès : la suite tourne en ~3 s. `forceExit` est à false dans
    # adonisrc, donc une fuite de handle fait traîner le process jusqu'au
    # timeout — autant le constater vite.
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Env de boot
        uses: ./.github/actions/boot-env

      - name: Base SQLite
        # `tests/domain/scenario_store.test.ts` écrit dans la table `scenarios` :
        # sans migration, il échoue en `SQLITE_CANTOPEN`. La base vit dans
        # `tmp/db.sqlite3` (config/database.ts) et se reconstruit à chaque run.
        run: |
          mkdir -p tmp
          node ace migration:run --force

      - name: Suite unit
        # `unit` est un ARGUMENT POSITIONNEL, pas un flag : `node ace test unit`.
        # Écrit `--suite=unit`, il est ignoré en silence et TOUTES les suites
        # tournent, functional comprise — c'est ce qui avait produit 25 échecs
        # « Identifiants X3 absents » au run 30173606998.
        #
        # La suite `functional` reste volontairement hors CI : 3 de ses 6
        # fichiers tapent X3, injoignable depuis un runner GitHub.
        run: npm test -- unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/deps
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Env de boot
        uses: ./.github/actions/boot-env

      - name: Build
        # Seul endroit où le packaging est exercé : le typecheck ne voit ni les
        # assets Vite, ni les `metaFiles` d'adonisrc (vues Edge, apps MCP), ni
        # la résolution ESM du bundle serveur.
        run: npm run build

      - name: Vérifier la sortie
        # `ace build` peut rendre 0 en ayant produit un dossier inutilisable :
        # on exige les deux sorties réelles (serveur compilé + assets Vite),
        # chemins constatés sur un build local.
        run: |
          test -f build/bin/server.js || { echo "::error::build/bin/server.js absent"; exit 1; }
          test -d build/public/assets || { echo "::error::assets Vite absents du build"; exit 1; }
