name: CI

# Remplace l'ancienne CI du monorepo Python (supprimée avec `apps/`,
# `services/` et `packages/` en 1e47671). Le dépôt est désormais une seule
# application AdonisJS 7 + React 19, sans Python ni workspace.

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Le dev tourne sur Node 26 — la CI doit valider la même chose.
  NODE_VERSION: '26'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Deux passes : la racine (backend, exclut inertia-react) puis le front.
        run: npm run typecheck

      - name: Env de boot
        uses: ./.github/actions/boot-env

      # Les deux vérifications suivantes régénèrent un fichier commité et
      # échouent sur `git diff --exit-code` : elles attrapent un artefact
      # périmé, pas une erreur de compilation. Le manifeste de routes s'était
      # déjà désynchronisé sans que personne le voie.
      - name: Manifeste de routes à jour
        run: npm run routes:check

      - name: Apps MCP à jour
        run: npm run mcp:apps:check

  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    # Court exprès : la suite tourne en ~3 s. `forceExit` est à false dans
    # adonisrc, donc une fuite de handle fait traîner le process jusqu'au
    # timeout — autant le constater vite.
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Env de boot
        uses: ./.github/actions/boot-env

      - name: Base SQLite
        # `tests/domain/scenario_store.test.ts` écrit dans la table `scenarios` :
        # sans migration, il échoue en `SQLITE_CANTOPEN`. La base vit dans
        # `tmp/db.sqlite3` (config/database.ts) et se reconstruit à chaque run.
        run: |
          mkdir -p tmp
          node ace migration:run --force

      - name: Suite unit
        # `unit` est un ARGUMENT POSITIONNEL, pas un flag : `node ace test unit`.
        # Écrit `--suite=unit`, il est ignoré en silence et TOUTES les suites
        # tournent, functional comprise — c'est ce qui avait produit 25 échecs
        # « Identifiants X3 absents » au run 30173606998.
        #
        # La suite `functional` reste volontairement hors CI : 3 de ses 6
        # fichiers tapent X3, injoignable depuis un runner GitHub.
        run: npm test -- unit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Env de boot
        uses: ./.github/actions/boot-env

      - name: Build
        # Seul endroit où le packaging est exercé : le typecheck ne voit ni les
        # assets Vite, ni les `metaFiles` d'adonisrc (vues Edge, apps MCP), ni
        # la résolution ESM du bundle serveur.
        run: npm run build

      - name: Vérifier la sortie
        # `ace build` peut rendre 0 en ayant produit un dossier inutilisable :
        # on exige les deux sorties réelles (serveur compilé + assets Vite),
        # chemins constatés sur un build local.
        run: |
          test -f build/bin/server.js || { echo "::error::build/bin/server.js absent"; exit 1; }
          test -d build/public/assets || { echo "::error::assets Vite absents du build"; exit 1; }
